<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简介</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f4f7fa;
            padding: 40px 20px;
            color: #2d3748;
        }
        .card {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #4299e1, #3182ce);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #fff;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            color: #3182ce;
            font-weight: bold;
        }
        .card-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .card-header p {
            opacity: 0.9;
            font-size: 16px;
        }
        .card-body {
            padding: 30px;
        }
        .section {
            margin-bottom: 28px;
        }
        .section h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #2b6cb0;
            border-left: 4px solid #3182ce;
            padding-left: 10px;
        }
        .section p {
            line-height: 1.7;
            font-size: 15px;
        }
        .skill-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top:10px;
        }
        .skill-tag {
            background-color: #edf2f7;
            padding: 6px 14px;
            border-radius: 999px;
            font-size:14px;
        }
        .contact-info {
            line-height:1.8;
        }
        .card-footer {
            text-align:center;
            padding:20px;
            background:#f7fafc;
            font-size:14px;
            color:#718096;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <div class="avatar" style="background-image:url(https://avatars.githubusercontent.com/u/36059946?v=4);background-size:cover;"></div>
            <h1>Mxnter Ye</h1>
            <p>个人简介</p>
        </div>
        <div class="card-body">
            <div class="section">
                <h2>关于我</h2>
                <p>
                    无
                </p>
            </div>

            <div class="section">
                <h2>技能</h2>
                <div class="skill-list">
                    <span class="skill-tag">无</span>
                    <!-- <span class="skill-tag">Git / GitHub</span>
                    <span class="skill-tag">Linux</span>
                    <span class="skill-tag">Windows运维</span>
                    <span class="skill-tag">JavaScript</span>
                    <span class="skill-tag">局域网服务搭建</span> -->
                </div>
            </div>

            <div class="section">
                <h2>联系方式</h2>
                <div class="contact-info">
                    <!-- <p>邮箱：example@xxx.com</p> -->
                    <p>GitHub：<a href="https://github.com/mxnter/">mxnter</a></p>
                </div>
            </div>
        </div>
        <div class="card-footer">
            © 2026 Mxnter Ye 个人主页
        </div>
    </div>
</body>
</html>
